project_name: "neptune_prometheus_angular"
project_save_dir: "./experiments"
training: true
accelerator: "gpu"
dataloader: "mmap"
checkpoint: ""
resume_training: false

data_options:
  data_path: "/home/dragonlol1/data/mmap_data/all_sky_prometheus_icgeo_12chan"
  val_split: 0.2
  split_seed: 42
  use_summary_stats: true
  summary_stats_mode: "standard"
  energy_weighting: null
  spectral_index: 2.0
  energy_weight_bins: 50
  dom_dropout: 0.0

model_options:
  in_channels: 9
  num_patches: 64
  token_dim: 256
  num_layers: 8
  num_heads: 4
  hidden_dim: 512
  dropout: 0.1
  drop_path_rate: 0.1
  downstream_task: "angular_reco"
  loss_fn: "gag"

training_options:
  batch_size: 256
  lr: 0.0001
  weight_decay: 0.01
  epochs: 30
  save_epochs: 10
  num_workers: 16
  precision: "bf16"
  grad_clip: 1.0
