# WhaT-1 v1.2 release config: trained ckpts/what-1_v1.2_final/neptune-v1.2-morph-classification.pt
project_name: "what-1_morphology_classification"
project_save_dir: "./experiments"
training: true
accelerator: "gpu"
dataloader: "mmap"
checkpoint: ""
resume_training: false

data_options:
  data_path:
  - "/scratch/mmap_data/22663"
  - "/scratch/mmap_data/22664"
  - "/scratch/mmap_data/22665"
  - "/scratch/mmap_data/22666"
  - "/scratch/mmap_data/22667"
  - "/scratch/mmap_data/22668"
  - "/scratch/mmap_data/22670"
  - "/scratch/mmap_data/22671"
  - "/scratch/mmap_data/22672"
  val_split: 0.05
  split_seed: 42
  use_summary_stats: true
  summary_stats_mode: "minimal"   # 4 features per DOM -> in_channels: 4
  energy_weighting: 'si+flat'
  spectral_index: [1.0, 1.5, 1.5, 1.5, 1.5, 1.0, 1.0, 1.5, 1.5]
  target_index: 1.5
  energy_weight_bins: 50
  dom_dropout: 0.1
  # Physics-informed per-event label smoothing inputs. When enabled, the dataloader
  # appends [muon_range_m, margin_in_m, margin_out_m] to each label (IceCube only).
  physics_labels:
    enabled: true
    geo_path: resources/icecube.geo
    z_shift_m: 1942.0   # icecube.geo (raw) -> detector-centered vertex frame
    padding_m: 50.0     # I3EventLabeler sig_padding; defines the containment surface

model_options:
  in_channels: 4
  num_patches: 64
  token_dim: 256
  num_layers: 8
  num_heads: 4
  hidden_dim: 672
  dropout: 0.1
  drop_path_rate: 0.15
  downstream_task: "morphology_classification"
  loss_fn: "cross_entropy"
  loss_kwargs:
    # sqrt-scaled inverse frequency weights, normalized so cascade (most common) = 1.00
    # Composition: 22.4M NuGen events
    # 0: cascade (32.8%), 1: starting (13.6%), 2: throughgoing (13.5%),
    # 3: stopping (17.2%), 4: uncontained (22.8%), 5: bundle (0.14%)
    class_weights: [1.00, 1.55, 1.56, 1.38, 1.20, 15.28]
    # Physics-informed per-event label smoothing (eps_max=0 -> plain hard-label CE).
    # Only near-edge / low-muon-energy (genuinely ambiguous) events are softened; clear
    # events keep hard labels. Requires data_options.physics_labels.enabled.
    label_smoothing:
      eps_max: 0.1
      L_ref_m: 100.0   # muon-track length below which a track looks cascade-like
      d_ref_m: 50.0    # boundary band for edge ambiguity (matches padding_m)
  pool_type: "attention"
  tokenizer_kwargs:
    knn_pool: "max_mean"
    assign_mode: "voronoi"
    lloyd_iters: 2

training_options:
  batch_size: 256
  lr: 0.0003
  weight_decay: 0.02
  epochs: 100
  save_epochs: 10
  num_workers: 8
  precision: "bf16"
  grad_clip: 1.0
