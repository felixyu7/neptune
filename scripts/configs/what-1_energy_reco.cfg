# WhaT-1 v1.2 release config: trained ckpts/what-1_v1.2_final/neptune-v1.2-energy-reco.pt
project_name: "what-1_energy_reco"
project_save_dir: "./experiments"
training: true
accelerator: "gpu"
dataloader: "mmap"
checkpoint: ""
resume_training: false

data_options:
  data_path:
  - "/scratch/mmap_data/22663"
  - "/scratch/mmap_data/22664"
  - "/scratch/mmap_data/22665"
  - "/scratch/mmap_data/22666"
  - "/scratch/mmap_data/22667"
  - "/scratch/mmap_data/22668"
  - "/scratch/mmap_data/22670"
  - "/scratch/mmap_data/22671"
  - "/scratch/mmap_data/22672"
  val_split: 0.05
  split_seed: 42
  use_summary_stats: true
  summary_stats_mode: "minimal"   # 4 features per DOM -> in_channels: 4
  energy_weighting: 'si+flat'
  spectral_index: [1.0, 1.5, 1.5, 1.5, 1.5, 1.0, 1.0, 1.5, 1.5]
  target_index: 1.5
  energy_weight_bins: 50
  dom_dropout: 0.1
  # 0: cascade, 1: starting, 2: throughgoing, 3: stopping, 5: bundle (4: uncontained excluded)
  morphology_filter: [0, 1, 2, 3, 5]

model_options:
  in_channels: 4
  num_patches: 64
  token_dim: 256
  num_layers: 8
  num_heads: 4
  hidden_dim: 672
  dropout: 0.1
  drop_path_rate: 0.2
  downstream_task: "energy_reco"
  loss_fn: "gaussian_nll"
  pool_type: "attention"
  tokenizer_kwargs:
    knn_pool: "max_mean"
    assign_mode: "voronoi"
    lloyd_iters: 2

training_options:
  batch_size: 256
  lr: 0.0003
  weight_decay: 0.03
  epochs: 100
  save_epochs: 10
  num_workers: 8
  precision: "bf16"
  grad_clip: 1.0
